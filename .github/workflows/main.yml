# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch: 

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
   test:
      name: Run Unit Tests
      runs-on: windows-latest
      
      steps:
          - name: ⬇️ Checkout Repository
            uses: actions/checkout@v5

          - name: ✅ Validate Gradle Wrapper
            uses: gradle/actions/wrapper-validation@v5

          - name: 🏗️ Set up JDK 17
            uses: actions/setup-java@v5
            with:
                java-version: 17
                distribution: 'temurin'
                cache: gradle

          - name: 📜 Set up Google Services
            run: |
                touch core/firebase/google-services.json
                echo "${CONTENT// /}" | base64 --decode > core/firebase/google-services.json
            env:
            CONTENT: ${{ secrets.GOOGLE_SERVICES }}

          - name: 🧹 Clean Project
            run: ./gradlew clean

          - name: 🔨 Unit tests
            run: ./gradlew testDevUnitTest --stacktrace
        
   build_apk:
    name: Upload apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v5

      - name: ✅ Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: 🏗️ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: 📜 Set up Google Services
        run: |
          touch core/firebase/google-services.json
          echo "${CONTENT// /}" | base64 --decode > core/firebase/google-services.json
        env:
          CONTENT: ${{ secrets.GOOGLE_SERVICES }}

      - name: 🧹 Clean Project
        run: ./gradlew clean

      - name: 🔨 Build Release APK
        run: ./gradlew assembleDebug

      - name: 📦 Upload APK as Artifact
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30


      - name: Build debug APK
        run: |
              sudo chmod +x ./gradlew
              ./gradlew assembleDebug --stacktrace

  github-release:
    name: 📋 Create GitHub Release
    needs: build  # Runs only if the APK build is successful ✅
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v5

      - name: 📦 Download APK Artifact
        uses: actions/download-artifact@v6
        with:
          name: release-apk
          path: ./apk

      - name: 📝 Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: CHANGELOG.md
          files: ./apk/*.apk
