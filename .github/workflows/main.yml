# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master/develop branch
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest # Geändert auf Ubuntu für bessere Kompatibilität mit ./gradlew

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v6

#      - name: ✅ Validate Gradle Wrapper
#        uses: gradle/actions/wrapper-validation@v3

      - name: 🏗️ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: 📜 Set up Google Services
        run: |
          mkdir -p core/firebase
          if [ ! -z "${{ secrets.GOOGLE_SERVICES }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES }}" | base64 --decode > core/firebase/google-services.json
          else
            echo "Warning: GOOGLE_SERVICES secret is empty or missing"
            echo "{}" > core/firebase/google-services.json
          fi

      - name: 🧹 Clean Project
        run: |
          chmod +x ./gradlew
          ./gradlew clean

      - name: 🔨 Unit tests
        run: |
          chmod +x ./gradlew./gradlew testDevUnitTest --stacktrace

  build_apk:
    name: Build & Upload APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v6

#      - name: ✅ Validate Gradle Wrapper
#        uses: gradle/actions/wrapper-validation@v3

      - name: 🏗️ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: 📜 Set up Google Services
        run: |
          mkdir -p core/firebase
          if [ ! -z "${{ secrets.GOOGLE_SERVICES }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES }}" | base64 --decode > core/firebase/google-services.json
          else
             echo "{}" > core/firebase/google-services.json
          fi

      - name: 🧹 Clean Project
        run: |
          chmod +x ./gradlew
          ./gradlew clean

      # Duplikat entfernt: Du hattest zweimal assembleDebug drin. Einmal reicht.
      - name: 🔨 Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📦 Upload APK as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-apk # Einheitlicher Name für Upload und Download
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  github-release:
    name: 📋 Create GitHub Release
    needs: build_apk  # Korrigiert: Der Job heißt 'build_apk', nicht 'build'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v6

      - name: 📦 Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-apk # Muss mit dem Upload-Namen übereinstimmen
          path: ./apk

      - name: 📝 Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: CHANGELOG.md
          files: ./apk/*.apk
