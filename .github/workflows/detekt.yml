name: Detekt Scan

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  workflow_dispatch:

jobs:
  detekt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Java passend zu deinem Projekt (Java 17 laut deiner build.gradle.kts)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Ausführen von Detekt über Gradle
      # Voraussetzung: Das Detekt Plugin ist in der build.gradle.kts eingebunden
      - name: Run Detekt
        run: sh ./gradlew detekt

      # Optional: Report hochladen, falls der Build fehlschlägt
      # Stelle sicher, dass Detekt so konfiguriert ist, dass es XML oder SARIF Reports erstellt
      - name: Upload SARIF report
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt
