[versions]
# --- Build & Plugins ---
androidGradlePlugin = "8.11.1"

java = "17"

kotlin = "2.0.21"
ksp = "2.0.21-1.0.26" # Passend zu Kotlin 2.0.21
kotlinSerialization = "1.6.3" # Prüfe auf aktuelle Version
googleServices = "4.4.1" # Aus BuildScript.Plugins.GMS (4.3.4 war sehr alt, 4.4.1 ist stable)
detekt = "1.23.6"
detektCompose = "0.3.12"
spotless = "7.0.0.BETA4"
#spotless = "6.25.0"

junit5Plugin = "1.10.0.0" # Aktualisiert für Kompatibilität
graphVisualizer = "0.5.0"
proguardGenerator = "1.0.8"

# --- AndroidX ---
coreKtx = "1.12.0"
appcompat = "1.6.1"
activity = "1.8.2"
fragment = "1.6.2"
lifecycle = "2.7.0"
constraintlayout = "2.1.4"
recyclerview = "1.3.2"
navigation = "2.7.7" # Aus Dependencies.kt (dort 2.3.2 -> aktualisiert auf stable)
material = "1.11.0"
splashscreen = "1.0.1"
cardview = "1.0.0" # Aus AndroidX.CARD_VIEW
androidxPreference = "1.2.1"

androidxComposeBom = "2025.10.01"

# --- Async & Architecture ---
coroutines = "1.8.0" # Aus Coroutines.VER (dort 1.4.2 -> aktualisiert)
playServicesCoroutines = "1.7.3" # KTX für Play Services
mvi = "4.6.0" # MviCore (bzw. Orbit/MVIKotlin je nach Library)
dagger = "2.50"

# --- Firebase & Google ---
firebaseBom = "32.7.2"
playServicesAuth = "21.0.0" # Aus Google.SIGN_IN (dort 19.0.0 -> aktualisiert)

# --- Network & Data ---
retrofit = "2.9.0"
okhttp = "4.12.0"
gson = "2.10.1"

# --- Utils ---
coil = "2.5.0" # Aus Libraries.COIL (dort 1.1.0 -> aktualisiert)
timber = "5.0.1" # Aus Libraries.TIMBER (dort 1.5.1 -> aktualisiert)
timberKt = "1.5.1" # Alte Version aus Dependencies.kt falls spezifisch benötigt
threetenabp = "1.4.6"
adapterDelegates = "4.3.2"
flexbox = "3.0.0" # Aus Libraries.FLEXBOX
gestureViews = "2.5.2" # Aus Libraries.GESTURE_VIEWS
beagle = "2.9.8" # Aus DebugMenu.VER

# --- Testing ---
junit = "4.13.2"
junit5 = "5.10.1" # Aus Tests.JUNIT_VER (dort 5.7.0 -> aktualisiert)
spek = "2.0.19" # Aus Tests.SPEK_VER (dort 2.0.15 -> aktualisiert)
mockk = "1.13.9" # Aus Tests.MOCKK (dort 1.9.3 -> aktualisiert)
strikt = "0.34.0" # Aus Tests.STRIKT (dort 0.28.1 -> aktualisiert)
filePeek = "0.1.3" # Aus Tests.FILE_PEEK
kotlinReflect = "2.0.21" # Passend zur Kotlin Version

dokka = "2.1.0"
dokkaMermaid = "0.6.0"

# ... SDK-CONFIG ...
namespace = "serg.chuprin.finances"
compileSdk = "36"
targetSdk = "35"
minSdk = "28"


[libraries]
# --- Gradle Plugins (als Libraries für build-logic) ---
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
spotless-gradlePlugin = { group = "com.diffplug.spotless", name = "spotless-plugin-gradle", version.ref = "spotless" }
junit5-gradlePlugin = { group = "de.mannodermaus.gradle.plugins", name = "android-junit5", version.ref = "junit5Plugin" }
navigation-gradlePlugin = { group = "androidx.navigation", name = "navigation-safe-args-gradle-plugin", version.ref = "navigation" }
dokka-gradlePlugin = { group = "org.jetbrains.dokka", name = "org.jetbrains.dokka.gradle.plugin", version.ref = "dokka" }

# ... DOKKA PLUGINS ...
dokka-android-plugin = { module = "org.jetbrains.dokka:android-documentation-plugin", version.ref = "dokka" }
dokka-mermaid-plugin = { module = "com.glureau:html-mermaid-dokka-plugin", version.ref = "dokkaMermaid" }

# --- AndroidX ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
